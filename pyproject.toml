[project]
name = "analisis-eventos-noaa"
version = "0.1.0"
description = "Proyecto de analisis reproducible sobre NOAA Storm Events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "codigo",
    "Data Original",
    "Data procesada",
    "Visualizaciones",
    "legacy",
]
[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noaa_eventos"]